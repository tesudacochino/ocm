[project]
name = "opencode-config-manager"
version = "2.0.1"
description = "Gestor de providers locales para opencode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
ocm = "opencode_config_manager.cli:main"
opencode-config-manager = "opencode_config_manager.cli:main"
# Ojo: no registrar un ejecutable llamado `opencode`: taparia el CLI real de
# opencode cuando ocm esta instalado en el mismo entorno (comprobado con uv).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_config_manager"]
